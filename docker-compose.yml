services:
  # The Astro site itself (output: "static" + @astrojs/node standalone
  # adapter — see astro.config.mjs and AGENTS.md §3/§8). Talks to `cap` over
  # the internal `cap-internal` network for the server-side /siteverify call
  # in src/pages/api/contacto.ts — set CAP_API_URL to http://cap:3000 in
  # production so that call never leaves the Docker network, while
  # PUBLIC_CAP_API_URL still points browsers at the public, HTTPS-only,
  # reverse-proxied Cap endpoint (per env.example's existing split).
  app:
    build:
      context: .
      args:
        PUBLIC_CAP_API_URL: ${PUBLIC_CAP_API_URL:?PUBLIC_CAP_API_URL must be set}
        PUBLIC_CAP_SITE_KEY: ${PUBLIC_CAP_SITE_KEY:?PUBLIC_CAP_SITE_KEY must be set}
        PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
    container_name: alba-abogacia-app
    environment:
      CAP_API_URL: ${CAP_API_URL:?CAP_API_URL must be set}
      CAP_SECRET_KEY: ${CAP_SECRET_KEY:?CAP_SECRET_KEY must be set}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:?CONTACT_RECIPIENT_EMAIL must be set}
      # MUST stay unset in production (src/pages/api/contacto.ts
      # resolveEmailTransport()) — never set this in a real deployment.
      CONTACT_EMAIL_TEST_MODE: ${CONTACT_EMAIL_TEST_MODE:-}
    depends_on:
      cap:
        condition: service_started
    networks:
      - cap-internal
    # No host `ports:` mapping — a reverse proxy (Dokploy's built-in Traefik,
    # or your own) reaches this container over the Docker network directly
    # and terminates TLS itself (AGENTS.md §9: "Publicar el endpoint solo
    # mediante HTTPS", never expose a plaintext port straight to the
    # internet). On Dokploy, configure this under the app's own "Domains"
    # tab (container port 4321) instead of adding `ports:` here — publishing
    # a host port here can collide with a port some other service on the
    # same host already uses. Running under plain Docker/Portainer with no
    # reverse proxy in front? Add back `ports: ["4321:4321"]` here.
    restart: unless-stopped

  # Self-hosted Cap CAPTCHA (https://capjs.js.org) — AGENTS.md §9.
  # Pinned to an explicit version, never `latest`, per the "no depender de `latest`
  # en producción" requirement.
  cap:
    image: tiago2/cap:3.1.11
    container_name: alba-abogacia-cap
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?CAP_ADMIN_KEY must be set}
      REDIS_URL: redis://valkey:6379
      # Restrict CORS to the production domain(s); defaults to `*` upstream if unset,
      # which AGENTS.md §9 explicitly forbids for production.
      CORS_ORIGIN: ${CAP_CORS_ORIGIN:?CAP_CORS_ORIGIN must be set to the production domain(s)}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - cap-internal
    # No host `ports:` mapping — same reasoning as `app` above: reached only
    # through a reverse proxy over the Docker network (Dokploy: this
    # service's own "Domains" tab, container port 3000), never a bare
    # host-published port (AGENTS.md §9). Plain Docker/Portainer with no
    # reverse proxy? Add back `ports: ["3000:3000"]` here.
    restart: unless-stopped

  # Valkey backs Cap's challenge/session storage. Kept as a separate, persistent
  # service per AGENTS.md §9 ("Mantener Cap y Valkey en servicios separados y
  # persistentes") — not reachable outside the internal network.
  valkey:
    image: valkey/valkey:9-alpine
    container_name: alba-abogacia-cap-valkey
    volumes:
      - cap-valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cap-internal
    restart: unless-stopped

networks:
  cap-internal:
    driver: bridge

volumes:
  cap-valkey-data:
